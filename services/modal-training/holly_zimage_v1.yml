# ═══ Holly Z-Image Turbo LoRA Training Config v1 ═══
# Trains Holly's face + body LoRA on Z-Image Turbo base using AI Toolkit.
#
# Dataset: Steve's curated 58-image set from "TRAINING SET HOLLY Self Image"
# (all poses incl. full-body standing — the critical category that was missing
# in all prior failed training runs).
#
# Run via AI Toolkit on Modal:
#   modal run run_modal.py --config-file-list-str=config/holly_zimage_v1.yml
#
# Key settings verified from:
#   - AI Toolkit source: arch="zimage", ZImageModel handler
#   - FACT.md: rank 16, 2000 steps, short captions, single LoRA
#   - Reddit r/comfyui: Z-Image training recipe consensus
#
# Budget: ~$1-2 (A100, 58 images, rank 16, 2000 steps = ~20-30 min)

---
job: extension
config:
  name: "holly_zimage_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "/root/ai-toolkit/output"
      device: cuda:0

      # Trigger word — added to captions if not present
      trigger_word: "h0lly"

      # ── Network (LoRA) ──────────────────────────────────────────
      network:
        type: "lora"
        linear: 16          # rank 16 (FACT.md + Reddit consensus)
        linear_alpha: 16

      # ── Save ────────────────────────────────────────────────────
      save:
        dtype: float16
        save_every: 500     # checkpoint every 500 steps
        max_step_saves_to_keep: 4

      # ── Dataset ─────────────────────────────────────────────────
      # 58 curated images with SHORT captions (trigger + pose/setting only)
      # NO body description in captions — locked in weights per FACT.md
      datasets:
        - folder_path: "/root/ai-toolkit/datasets/holly-zimage-v1"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]

      # ── Training ────────────────────────────────────────────────
      train:
        batch_size: 1
        steps: 2000               # FACT.md sweet spot (1500-2500)
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 4e-4
        dtype: bf16
        ema_config:
          use_ema: true
          ema_decay: 0.99

      # ── Model ───────────────────────────────────────────────────
      model:
        # Z-Image Turbo base
        name_or_path: "Tongyi-MAI/Z-Image-Turbo"
        arch: "zimage"            # AI Toolkit's native Z-Image handler
        is_flux: true             # flow-matching code path
        quantize: true            # 4-bit base → fits A100 with headroom
        quantize_te: true         # quantize text encoder too

      # ── Sampling (preview during training) ──────────────────────
      sample:
        sampler: "flowmatch"
        sample_every: 500
        sample_start_step: 0
        width: 1024
        height: 1024
        prompts:
          - "h0lly, closeup portrait of a woman smiling, soft lighting"
          - "h0lly, h0lly-body, woman standing full body, bedroom"
          - "h0lly, h0lly-body, woman lying on bed, intimate"
        seed: 42
        guidance_scale: 0         # Turbo → 0 CFG
        sample_steps: 4           # Turbo = 4 steps
        walk_seed: true

meta:
  name: "holly_zimage_v1"
  version: '1.0'
