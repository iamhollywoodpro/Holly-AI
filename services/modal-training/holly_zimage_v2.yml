---
job: extension
config:
  name: "holly_zimage_v2"
  process:
    - type: 'sd_trainer'
      training_folder: "/root/ai-toolkit/modal_output"
      device: cuda:0
      trigger_word: "h0lly"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/root/ai-toolkit/datasets/holly-zimage-v1"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 4e-4
        dtype: bf16
        ema_config:
          use_ema: true
          ema_decay: 0.99
      model:
        name_or_path: "ostris/Z-Image-De-Turbo"
        extras_name_or_path: "Tongyi-MAI/Z-Image-Turbo"
        arch: "zimage"
        assistant_lora_path: "ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v2.safetensors"
        quantize: true
        quantize_te: true
      sample:
        sampler: "flowmatch"
        sample_every: 500
        sample_start_step: 0
        width: 1024
        height: 1024
        prompts:
          - "h0lly, closeup portrait of a woman smiling, soft lighting"
          - "h0lly, h0lly-body, woman standing full body, bedroom"
          - "h0lly, h0lly-body, woman lying on bed, intimate"
        seed: 42
        guidance_scale: 0
        sample_steps: 4
        walk_seed: true
meta:
  name: "holly_zimage_v2"
  version: '2.0'
